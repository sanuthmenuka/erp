[options]
; Database settings
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo

; Paths
addons_path = /workspace/odoo/odoo/addons,/workspace/odoo/addons,/workspace/third-party/odoomates
; Uncomment to add enterprise addons:
; addons_path = /workspace/odoo/addons,/workspace/enterprise

; Server settings
http_port = 8069
longpolling_port = 8072

; Development settings
dev_mode = reload,qweb,werkzeug,xml

; Logging
log_level = info
