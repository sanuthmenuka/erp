; Quick Bite ERP - Odoo 19 development configuration.
; Every script in scripts/ runs Odoo with `-c /workspace/odoo.conf`, so this file
; is the single source of truth. Machine-specific overrides: copy to
; odoo.local.conf (gitignored) and export ODOO_RC=/workspace/odoo.local.conf.

[options]
; --- Database -------------------------------------------------------------
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = odoo
list_db = False

; --- Paths ----------------------------------------------------------------
; Order matters: core first, then vendored third-party, then our own modules.
addons_path = /workspace/odoo/odoo/addons,/workspace/odoo/addons,/workspace/third-party/odoomates,/workspace/custom-addons
; Filestore + sessions live on the bind mount so they survive container rebuilds
; and are captured by scripts/db-backup.
data_dir = /workspace/.odoo-data

; --- Server ---------------------------------------------------------------
http_port = 8069
gevent_port = 8072
; Demo data is off by default in Odoo 19 (use --with-demo to enable).

; --- Development ----------------------------------------------------------
dev_mode = reload,qweb,xml
log_level = info
